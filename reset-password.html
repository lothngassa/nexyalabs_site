<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réinitialiser le mot de passe - NEXYA AI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080B">
<script>(function(d){var r=d.documentElement,t;try{t=localStorage.getItem('nx-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}r.setAttribute('data-theme',t);r.classList.add('js');if(t==='light'){var m=d.querySelector('meta[name="theme-color"]');if(m)m.content='#FBFBFD'}})(document)</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/base.css">
<script src="/assets/js/page.js" defer></script>
</head>
<body>
<header class="nav nav--simple" data-nav>
  <div class="nav__in wrap">
    <a class="brand" href="/" aria-label="NEXYA, accueil">
      <picture><source srcset="/assets/images/mark.webp" type="image/webp"><img src="/assets/images/logo_nexya_opt.png" alt="" width="21" height="23" decoding="async"></picture>
      <span>NEXYA</span>
    </a>
    <div class="nav__actions">
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Changer de thème">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page-center">
  <div class="card">
    <picture><source srcset="/assets/images/mark.webp" type="image/webp"><img class="card__mark" src="/assets/images/logo_nexya_opt.png" alt="" width="30" height="33"></picture>
    <div id="content" aria-live="polite"></div>
    <p class="foot">NEXYA AI, par Nexyalabs</p>
  </div>
</main>

<script>
const API = 'https://api.nexyalabs.com';
const token = new URLSearchParams(location.search).get('token');
const content = document.getElementById('content');
const ICONS = {
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m22 4-10 10-3-3"/></svg>'
};

function centerState(kind, title, text){
  content.innerHTML = '<div class="center"><div class="state-ico state-ico--' + kind + '">' + ICONS[kind] + '</div><h1>' + title + '</h1><p class="sub">' + text + '</p></div>';
}

if (!token) {
  centerState('warn', 'Lien invalide', "Ce lien de réinitialisation est incomplet ou a déjà été utilisé. Redemande une réinitialisation depuis l'application NEXYA.");
} else {
  content.innerHTML =
    '<h1>Nouveau mot de passe</h1>' +
    '<p class="sub">Choisis un nouveau mot de passe pour ton compte NEXYA.</p>' +
    '<label class="field" for="pw"><span>Nouveau mot de passe</span>' +
    '<input id="pw" type="password" autocomplete="new-password" placeholder="••••••••" /></label>' +
    '<ul class="rules">' +
      '<li id="r-len">Au moins 8 caractères</li>' +
      '<li id="r-up">Une majuscule</li>' +
      '<li id="r-low">Une minuscule</li>' +
      '<li id="r-dig">Un chiffre</li>' +
    '</ul>' +
    '<label class="field" for="pw2"><span>Confirme le mot de passe</span>' +
    '<input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••" /></label>' +
    '<button id="submit" class="btn btn--primary btn--block" type="button" disabled>Réinitialiser</button>' +
    '<div id="msg" class="msg" role="alert"></div>';

  const pw = document.getElementById('pw');
  const pw2 = document.getElementById('pw2');
  const btn = document.getElementById('submit');
  const msg = document.getElementById('msg');
  const rules = { len: v => v.length >= 8, up: v => /[A-Z]/.test(v), low: v => /[a-z]/.test(v), dig: v => /\d/.test(v) };

  function check(){
    const v = pw.value;
    let allok = true;
    for (const k in rules){
      const ok = rules[k](v);
      document.getElementById('r-' + k).classList.toggle('ok', ok);
      if (!ok) allok = false;
    }
    btn.disabled = !(allok && v.length <= 128 && v.length > 0 && pw2.value === v);
    return allok;
  }
  pw.addEventListener('input', check);
  pw2.addEventListener('input', check);

  btn.addEventListener('click', async () => {
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Envoi…';
    try {
      const r = await fetch(API + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: pw.value })
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.success !== false) {
        centerState('ok', 'Mot de passe modifié', "C'est fait. Retourne dans l'application NEXYA et connecte-toi avec ton nouveau mot de passe.");
      } else {
        const code = (j && j.code) || '';
        if (code.indexOf('EXPIRED') !== -1 || code.indexOf('INVALID') !== -1) {
          msg.textContent = "Ce lien a expiré ou n'est plus valide. Redemande une réinitialisation depuis l'application NEXYA.";
        } else if (r.status === 422) {
          msg.textContent = "Mot de passe non conforme. Vérifie les critères ci-dessus.";
        } else {
          msg.textContent = (j && j.error) || "Une erreur est survenue. Réessaie dans un instant.";
        }
        msg.classList.add('show', 'err');
        btn.disabled = false;
        btn.textContent = 'Réinitialiser';
      }
    } catch (e) {
      msg.textContent = "Impossible de joindre le serveur. Vérifie ta connexion et réessaie.";
      msg.classList.add('show', 'err');
      btn.disabled = false;
      btn.textContent = 'Réinitialiser';
    }
  });
}
</script>
</body>
</html>
